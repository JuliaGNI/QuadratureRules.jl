name: CI
on:
    push:
        branches:
            - main
        tags: ["*"]
    pull_request:
concurrency:
    # Skip intermediate builds: always.
    # Cancel intermediate builds: only if it is a pull request build.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
    test:
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
        runs-on: ${{ matrix.os }}
        continue-on-error: ${{ matrix.experimental }}
        strategy:
            fail-fast: false
            matrix:
                version:
                    - "1.10"
                    - "1.12"
                    - "^1.13.0-0"
                os:
                    - ubuntu-latest
                    - macOS-latest
                    - windows-latest
                arch:
                    - default
                experimental: [false]
                include:
                    - version: "nightly"
                      os: ubuntu-latest
                      arch: default
                      experimental: true
                    - version: "nightly"
                      os: macOS-latest
                      arch: default
                      experimental: true
                    - version: "nightly"
                      os: windows-latest
                      arch: default
                      experimental: true
        steps:
            - uses: actions/checkout@v6
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.version }}
                  arch: ${{ matrix.arch }}
            - uses: julia-actions/cache@v3
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
            - uses: julia-actions/julia-processcoverage@v1
            - uses: codecov/codecov-action@v6
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  files: lcov.info
    symbolic:
        # The symbolic tests are not part of the test target above, since SymPyPythonCall
        # provisions a private Python environment with sympy on first use, which the matrix
        # would pay for in every one of its entries. They run here instead, in the environment
        # of test/symbolic/Project.toml.
        name: Symbolic - Julia ${{ matrix.version }} - ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                version:
                    - "1.10"
                    - "1"
                os:
                    - ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.version }}
            - uses: julia-actions/cache@v3
            - name: Install dependencies
              run: |
                  julia --project=test/symbolic -e '
                    using Pkg
                    Pkg.develop(PackageSpec(path=pwd()))
                    Pkg.instantiate()
                    Pkg.precompile()'
            - name: Run tests
              run: julia --project=test/symbolic test/test_symbolic.jl
